# Icon tokens
# Mirrors the icon token list from the visual system specification §5.1.
# Used by Hugo templates to render icon references and the Icon Key.

icons:
  - token: 'restroom'
    meaning: 'Restroom location'
  - token: 'quiet-zone'
    meaning: 'Quiet room or quiet zone'
  - token: 'coffee'
    meaning: 'Coffee and beverage station'
  - token: 'talk'
    meaning: 'Talk or presentation session type'
  - token: 'workshop'
    meaning: 'Workshop or interactive session type'
  - token: 'break'
    meaning: 'Break period'
  - token: 'meal'
    meaning: 'Meal period'
  - token: 'social'
    meaning: 'Social event or gathering'
  - token: 'wifi'
    meaning: 'Wi-Fi available'
  - token: 'emergency-exit'
    meaning: 'Emergency exit'
  - token: 'accessibility'
    meaning: 'Step-free and accessible route'
  - token: 'stairs'
    meaning: 'Stair location'
  - token: 'elevator'
    meaning: 'Elevator location'
  - token: 'bike'
    meaning: 'Bicycle parking'
  - token: 'parking'
    meaning: 'Car parking'
  - token: 'info'
    meaning: 'General information point'
  - token: 'first-aid'
    meaning: 'First aid and medical'
  - token: 'phone'
    meaning: 'Phone and contact point'
  - token: 'pin'
    meaning: 'Location marker'
